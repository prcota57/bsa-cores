<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BSA Cores">
<title>BSA Cores</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none; user-select: none; }
body { display: flex; flex-direction: column; background: #111; transition: background 0.15s ease; }

#topbar {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: 14px; padding-left: 18px; padding-right: 18px;
  background: rgba(0,0,0,0.45);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  z-index: 100;
}
.lbl { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.6); min-width: 22px; text-align: center; }
.stepBtn { width: 88px; height: 88px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 46px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-appearance: none; appearance: none; }
.stepBtn:active { background: rgba(255,255,255,0.3); transform: scale(0.92); }
#speed-display { font-size: 22px; font-weight: 900; color: #fff; min-width: 46px; text-align: center; }
#nivel-watermark {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: min(52vw, 60vh); font-weight: 900; color: rgba(255,255,255,0.32);
  line-height: 1; pointer-events: none; user-select: none; z-index: 2;
  text-shadow: 0 0 40px rgba(0,0,0,0.25);
}
#btn-parar { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.btn-hub { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; font-size: 17px; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0; }

#arena { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: max(20px, env(safe-area-inset-bottom)); }

#idle { display: flex; flex-direction: column; align-items: center; gap: 20px; }
#idle-emoji { font-size: 72px; line-height: 1; }
#idle-title { font-size: 28px; font-weight: 900; color: rgba(255,255,255,0.9); }
#idle-sub { font-size: 15px; color: rgba(255,255,255,0.4); font-weight: 500; }
#btn-iniciar { margin-top: 8px; width: 200px; height: 64px; border-radius: 32px; background: #fff; border: none; outline: none; font-size: 22px; font-weight: 900; color: #111; cursor: pointer; -webkit-appearance: none; appearance: none; }
#btn-iniciar:active { transform: scale(0.96); }

/* tela 100% cor — sem texto */
#cor-card { display: none; width: 100%; height: 100%; }
#cor-card.visible { display: block; }
</style>
</head>
<body>

<div id="topbar">
  <a class="btn-hub" href="https://prcota57.github.io/BSA-cadastro/" title="Voltar ao início">&#8592;</a>
  <button class="stepBtn" id="spdMinus">−</button>
  <span id="speed-display">3s</span>
  <button class="stepBtn" id="spdPlus">+</button>
  <div id="btn-parar">
    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="white"/></svg>
  </div>
</div>

<div id="arena">
  <div id="idle">
    <div id="idle-emoji">🎨</div>
    <div id="idle-title">BSA Cores</div>
    <div id="idle-sub">Toque para começar</div>
    <button id="btn-iniciar" type="button">INICIAR</button>
  </div>
  <div id="cor-card"><div id="nivel-watermark"></div></div>
</div>

<script>
var CORES = [
  { bg: '#0057B8', freq: 220, tipo: 'sine',     dur: 0.5  },
  { bg: '#FFD700', freq: 440, tipo: 'triangle', dur: 0.4  },
  { bg: '#DD1717', freq: 880, tipo: 'square',   dur: 0.25 }
];

var atual = -1, timer = null, rodando = false, audioCtx = null;

function getAC() {
  if (!audioCtx || audioCtx.state === 'closed') audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tocar(c) {
  try {
    var ac = getAC(), now = ac.currentTime;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = c.tipo; o.frequency.value = c.freq;
    g.gain.setValueAtTime(0.0, now);
    g.gain.linearRampToValueAtTime(0.3, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + c.dur);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + c.dur);
  } catch(e) {}
}

var elBody    = document.body;
var elSpdMinus = document.getElementById('spdMinus');
var elSpdPlus  = document.getElementById('spdPlus');
var elSpeed   = document.getElementById('speed-display');
var elParar   = document.getElementById('btn-parar');
var elIniciar = document.getElementById('btn-iniciar');
var elIdle    = document.getElementById('idle');
var elCard    = document.getElementById('cor-card');

var SPD_MIN = 1, SPD_MAX = 5, SPD_STEP = 0.5;
var spdValue = 3;
var elWatermark = document.getElementById('nivel-watermark');

function fmtSpd(v) {
  return (Math.round(v * 10) % 10 === 0) ? String(Math.round(v)) : v.toFixed(1).replace('.', ',');
}
function renderSpd() {
  elSpeed.textContent = fmtSpd(spdValue) + 's';
  elWatermark.textContent = fmtSpd(spdValue);
  if (rodando) { clearInterval(timer); timer = setInterval(trocar, spdValue * 1000); }
  if (navigator.vibrate) navigator.vibrate(8);
}
function changeSpd(delta) {
  spdValue = Math.min(SPD_MAX, Math.max(SPD_MIN, Math.round((spdValue + delta) * 10) / 10));
  renderSpd();
}
function setupHold(btn, delta) {
  var interval = null, timeout = null;
  function start(e) {
    e.preventDefault();
    changeSpd(delta);
    timeout = setTimeout(function() {
      interval = setInterval(function() { changeSpd(delta); }, 250);
    }, 400);
  }
  function stop() { clearTimeout(timeout); clearInterval(interval); }
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('touchend', stop);
  btn.addEventListener('touchcancel', stop);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
}
setupHold(elSpdMinus, -SPD_STEP);
setupHold(elSpdPlus, SPD_STEP);
elSpeed.textContent = fmtSpd(spdValue) + 's';
elWatermark.textContent = fmtSpd(spdValue);

function trocar() {
  var prox; do { prox = Math.floor(Math.random() * CORES.length); } while (prox === atual);
  atual = prox;
  var c = CORES[atual];
  elBody.style.background = c.bg;
  tocar(c);
}

/* Wake Lock: impede que a tela apague enquanto o app estiver aberto/em uso */
var wakeLock = null;
async function pedirWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* dispositivo sem suporte — sem problema */ }
}
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') pedirWakeLock();
});
pedirWakeLock();

function iniciar() {
  getAC(); rodando = true;
  pedirWakeLock();
  elIdle.style.display = 'none';
  elCard.classList.add('visible');
  trocar();
  timer = setInterval(trocar, spdValue * 1000);
}
function parar() {
  rodando = false; clearInterval(timer); atual = -1;
  elBody.style.background = '#111';
  elIdle.style.display = 'flex';
  elCard.classList.remove('visible');
}

function addTap(el, fn) {
  el.addEventListener('touchend', function(e) { e.preventDefault(); fn(); });
  el.addEventListener('click', function(e) { e.preventDefault(); fn(); });
}
addTap(elIniciar, function() { if (!rodando) iniciar(); });
addTap(elParar,   function() { if (rodando)  parar();  });
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
